###############################################################################
# Challenge PHP Hexagonal - GIFs API
#
#   docker compose up -d --build
#   -> API available at http://localhost:8080/api/v1
#
###############################################################################

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: prex/gifs-api:local
    container_name: prex-gifs-app
    restart: unless-stopped
    # No `env_file` on purpose: the project directory (including .env) is bind
    # mounted below, so Laravel reads it directly. Injecting the same file as
    # container environment would shadow it - a real environment variable always
    # wins over .env, so an empty APP_KEY/GIPHY_API_KEY would break the app even
    # after the entrypoint fills them in.
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-mariadb}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-prex_gifs}
      DB_USERNAME: ${DB_USERNAME:-prex}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
      - app-vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    networks: [prex]

  nginx:
    image: nginx:1.27-alpine
    container_name: prex-gifs-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [prex]

  database:
    image: mariadb:11.4
    container_name: prex-gifs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-prex_gifs}
      MARIADB_USER: ${DB_USERNAME:-prex}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    ports:
      - "${DB_FORWARD_PORT:-33061}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [prex]

volumes:
  db-data:
  app-vendor:

networks:
  prex:
    driver: bridge
