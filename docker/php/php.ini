; ---------------------------------------------------------------------------
; Application defaults (mounted as /usr/local/etc/php/conf.d/99-app.ini)
; ---------------------------------------------------------------------------
memory_limit = 512M
max_execution_time = 60
post_max_size = 16M
upload_max_filesize = 16M
date.timezone = UTC
expose_php = Off

; A JSON API does not need HTML errors; everything goes to the logs.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
